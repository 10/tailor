[project]
name = "tailor"
version = "0.1.0"
description = "Programmable self-hosted proxy for modifying HTTP(S) traffic during development."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mitmproxy>=11,<13",
]

[project.scripts]
tailor = "tailor.cli:main"

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tailor"]

[tool.ruff]
line-length = 100
