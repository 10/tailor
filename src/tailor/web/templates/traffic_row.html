<tr class="clickable" data-href="/traffic/$id">
  <td class="col-time"><a href="/traffic/$id">$time</a></td>
  <td class="col-method"><span class="badge method">$method</span></td>
  <td class="col-status"><span class="status-code $status_class">$status</span></td>
  <td class="col-url">$url</td>
  <td class="col-matched">$matched</td>
</tr>
